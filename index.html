<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Patient Partridge</title>
    <!-- Sets a forced theme before the first paint. Same origin, so the strict CSP allows it. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Icon sprite: 24px grid, 1.5px stroke, painted with currentColor. -->
    <svg class="vh" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="6" cy="12" r="1.35" fill="currentColor" stroke="none" />
          <circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none" />
          <circle cx="18" cy="12" r="1.35" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 3v1.75M12 19.25V21M3 12h1.75M19.25 12H21M5.64 5.64l1.24 1.24M17.12 17.12l1.24 1.24M5.64 18.36l1.24-1.24M17.12 6.88l1.24-1.24" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.75 7.75 0 0 1 9.4 4.5a7.75 7.75 0 1 0 10.1 10.1z" /></symbol>
        <symbol id="i-theme-auto" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.25" />
          <path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l4.75 4.75" /></symbol>
        <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="M5.5 14.5L12 8l6.5 6.5" /></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M5.5 9.5L12 16l6.5-6.5" /></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.75l4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
          <path d="M14 4.5h5.5V10" /><path d="M19.5 4.5L11 13" />
          <path d="M18 13.5v4.75a1.25 1.25 0 0 1-1.25 1.25H5.75a1.25 1.25 0 0 1-1.25-1.25V7.25C4.5 6.56 5.06 6 5.75 6h4.75" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" /><path d="M13.5 3.5V8H18" />
        </symbol>
        <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" /><path d="M9.5 5v14" /></symbol>
        <symbol id="i-printer" viewBox="0 0 24 24">
          <path d="M7 9V4.5h10V9" /><rect x="4" y="9" width="16" height="8" rx="2" /><path d="M7 14h10v5.5H7z" />
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24">
          <path d="M9.5 7h10M9.5 12h10M9.5 17h10" />
          <circle cx="5" cy="7" r="1" fill="currentColor" stroke="none" />
          <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none" />
          <circle cx="5" cy="17" r="1" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="4" y="4" width="6.5" height="6.5" rx="1.75" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.75" />
          <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.75" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.75" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M19.25 12a7.25 7.25 0 1 1-2.3-5.3" /><path d="M19.25 4.5v4.25H15" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 4.5v10.25M7.75 10.5L12 14.75l4.25-4.25M5 19.5h14" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M5 7h14M9.5 7V4.75h5V7M7 7l.75 12.25a1 1 0 0 0 1 .95h6.5a1 1 0 0 0 1-.95L17 7" />
        </symbol>
        <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M6.5 4.5l11.5 6.4-5 1.6-2.2 5.2z" /></symbol>
        <symbol id="i-highlighter" viewBox="0 0 24 24">
          <path d="M14.75 5.25l4 4-8.25 8.25-4.5.75.75-4.5z" /><path d="M4.5 20.25h8.5" />
        </symbol>
        <symbol id="i-underline" viewBox="0 0 24 24">
          <path d="M7.5 4.5v6.25a4.5 4.5 0 0 0 9 0V4.5" /><path d="M5.5 20h13" />
        </symbol>
        <symbol id="i-strikeout" viewBox="0 0 24 24">
          <path d="M4.5 12h15" />
          <path d="M16.75 7.25A4.5 4.5 0 0 0 12.25 5c-2.5 0-4.25 1.3-4.25 3.25 0 1.3.8 2.2 2.4 2.75M14.1 13.2c1.5.55 2.4 1.4 2.4 2.7 0 2-1.9 3.35-4.5 3.35a5.5 5.5 0 0 1-4-1.6" />
        </symbol>
        <symbol id="i-note" viewBox="0 0 24 24">
          <path d="M5.75 4.5h12.5a1.25 1.25 0 0 1 1.25 1.25v8.75l-5.5 5.5H5.75A1.25 1.25 0 0 1 4.5 18.75V5.75A1.25 1.25 0 0 1 5.75 4.5z" /><path d="M14 20v-4.25a1.25 1.25 0 0 1 1.25-1.25H19.5" />
        </symbol>
        <symbol id="i-pen" viewBox="0 0 24 24">
          <path d="M4.5 19.5l.9-4.1L16.2 4.6a2.1 2.1 0 0 1 3 3L8.6 18.6z" /><path d="M14.5 6.3l3.2 3.2" />
        </symbol>
        <symbol id="i-stamp" viewBox="0 0 24 24">
          <path d="M9.25 14V9.25a2.75 2.75 0 1 1 5.5 0V14" /><path d="M5.5 14h13v3.25h-13z" /><path d="M4.5 20.25h15" />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 5.5L4.5 9.5l4 4" /><path d="M4.5 9.5h9a5 5 0 0 1 0 10H9.5" /></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15.5 5.5l4 4-4 4" /><path d="M19.5 9.5h-9a5 5 0 0 0 0 10h4" /></symbol>
        <symbol id="i-comment" viewBox="0 0 24 24">
          <path d="M5.75 5h12.5A1.25 1.25 0 0 1 19.5 6.25v8.5A1.25 1.25 0 0 1 18.25 16h-6.5L7.5 19.5V16H5.75a1.25 1.25 0 0 1-1.25-1.25v-8.5A1.25 1.25 0 0 1 5.75 5z" />
        </symbol>
      </defs>
    </svg>

    <div class="app" id="app">
      <header class="bar" id="bar">
        <div class="tabstrip">
          <div class="tabs" id="tabs" role="tablist" aria-label="Open documents"></div>
          <button class="btn btn-icon btn-plain" id="open-button" type="button" title="Open a PDF (Ctrl+O)" aria-label="Open a PDF">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
        </div>
        <div class="toolbar" id="toolbar">
          <button class="btn btn-icon btn-plain" id="sidebar-toggle" type="button" title="Show the side panel (Ctrl+B)" aria-label="Side panel" aria-pressed="false" aria-controls="sidebar">
            <svg class="icon" aria-hidden="true"><use href="#i-panel"></use></svg>
          </button>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <label class="page-box">
            <span class="vh">Page number</span>
            <input class="field-input" id="page-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" size="4" disabled />
            <span id="page-total" class="page-total muted num"></span>
          </label>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <button class="btn btn-icon btn-plain" id="zoom-out" type="button" title="Zoom out (Ctrl+-)" aria-label="Zoom out" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg>
          </button>
          <label class="zoom-box">
            <span class="vh">Zoom</span>
            <select class="select" id="zoom-select" disabled></select>
          </label>
          <button class="btn btn-icon btn-plain" id="zoom-in" type="button" title="Zoom in (Ctrl++)" aria-label="Zoom in" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
          <span class="grow"></span>
          <button class="pill pill-update" id="update-pill" type="button" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
            <span id="update-pill-label">Update</span>
          </button>
          <button class="btn btn-icon btn-plain" id="print-button" type="button" title="Print (Ctrl+P)" aria-label="Print" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-printer"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="annotate-button" type="button" title="Annotate (Ctrl+Shift+A)" aria-label="Annotate" aria-pressed="false" aria-controls="annotbar" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-pen"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="find-button" type="button" title="Find in this document (Ctrl+F)" aria-label="Find" aria-pressed="false" aria-controls="findbar" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="menu-button" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
            <svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg>
          </button>
        </div>
        <div class="annotbar" id="annotbar" role="toolbar" aria-label="Annotations" aria-orientation="horizontal" hidden>
          <div class="segmented" role="group" aria-label="Tool">
            <button type="button" id="tool-select" aria-pressed="true" aria-label="Select" title="Select (V)">
              <svg class="icon" aria-hidden="true"><use href="#i-cursor"></use></svg>
            </button>
            <button type="button" id="tool-highlight" aria-pressed="false" aria-label="Highlight" title="Highlight (H)">
              <svg class="icon" aria-hidden="true"><use href="#i-highlighter"></use></svg>
            </button>
            <button type="button" id="tool-underline" aria-pressed="false" aria-label="Underline" title="Underline (U)">
              <svg class="icon" aria-hidden="true"><use href="#i-underline"></use></svg>
            </button>
            <button type="button" id="tool-strikeout" aria-pressed="false" aria-label="Strike out" title="Strike out (T)">
              <svg class="icon" aria-hidden="true"><use href="#i-strikeout"></use></svg>
            </button>
            <button type="button" id="tool-note" aria-pressed="false" aria-label="Note" title="Note (N)">
              <svg class="icon" aria-hidden="true"><use href="#i-note"></use></svg>
            </button>
            <button type="button" id="tool-pen" aria-pressed="false" aria-label="Pen" title="Pen (P)">
              <svg class="icon" aria-hidden="true"><use href="#i-pen"></use></svg>
            </button>
            <button type="button" id="tool-stamp" aria-pressed="false" aria-label="Stamp" title="Stamp (M)">
              <svg class="icon" aria-hidden="true"><use href="#i-stamp"></use></svg>
            </button>
          </div>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <div class="swatches" id="swatches" role="radiogroup" aria-label="Colour"></div>
          <div class="segmented segmented-pen" id="pen-widths" role="group" aria-label="Line width" hidden></div>
          <span class="grow"></span>
          <button class="btn btn-icon btn-plain" id="annot-edit" type="button" title="Edit the text (Enter)" aria-label="Edit the text of the selected annotation" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-comment"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="annot-delete" type="button" title="Delete (Del)" aria-label="Delete the selected annotation" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
          </button>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <button class="btn btn-icon btn-plain" id="annot-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-undo"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="annot-redo" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-redo"></use></svg>
          </button>
          <span class="annotbar-note muted" id="annot-note" hidden></span>
        </div>
        <div class="findbar" id="findbar" role="search" hidden>
          <label class="search">
            <span class="vh">Find in this document</span>
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="find-input" type="search" placeholder="Find in this document" autocomplete="off" spellcheck="false" maxlength="256" />
          </label>
          <span class="find-status muted num" id="find-status" role="status" aria-live="polite"></span>
          <button class="btn btn-icon btn-plain" id="find-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-up"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="find-next" type="button" title="Next match (Enter)" aria-label="Next match">
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </button>
          <button class="btn btn-icon btn-plain" id="find-close" type="button" title="Close (Esc)" aria-label="Close search">
            <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
          </button>
        </div>
      </header>

      <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Pages and contents" hidden>
        <div class="sidebar-head">
          <div class="segmented segmented-block" role="tablist" aria-label="Side panel">
            <button type="button" role="tab" id="side-tab-pages" data-panel="pages" aria-controls="thumbs" aria-selected="true">
              <svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg><span>Pages</span>
            </button>
            <button type="button" role="tab" id="side-tab-contents" data-panel="contents" aria-controls="outline" aria-selected="false">
              <svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg><span>Contents</span>
            </button>
          </div>
        </div>
        <div class="thumbs" id="thumbs" role="tabpanel" aria-labelledby="side-tab-pages" tabindex="-1"></div>
        <div class="outline" id="outline" role="tabpanel" aria-labelledby="side-tab-contents" tabindex="-1" hidden></div>
      </aside>

      <main class="stage" id="stage">
        <div class="empty" id="empty">
          <div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-file"></use></svg></div>
          <h1 class="empty-title">Patient Partridge</h1>
          <p class="empty-text">Drop a PDF file here, or open one. Your documents never leave this computer.</p>
          <div class="empty-actions">
            <button class="btn btn-primary btn-lg" id="empty-open" type="button">Open a PDF</button>
          </div>
          <p class="empty-text">
            <kbd>Ctrl</kbd> <kbd>O</kbd> opens a file. <kbd>Page Down</kbd>, <kbd>Space</kbd> and the arrow keys scroll.
          </p>
        </div>
        <div class="drop-overlay" id="drop-overlay" hidden><span>Drop a PDF to open it</span></div>
      </main>
      </div>

      <div class="menu" id="menu" role="menu" aria-label="Settings" hidden>
        <p class="menu-label" id="theme-label">Appearance</p>
        <div class="segmented" id="theme-choice" role="radiogroup" aria-labelledby="theme-label">
          <label><input type="radio" name="theme" value="auto" /><svg class="icon" aria-hidden="true"><use href="#i-theme-auto"></use></svg><span>Auto</span></label>
          <label><input type="radio" name="theme" value="light" /><svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg><span>Light</span></label>
          <label><input type="radio" name="theme" value="dark" /><svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg><span>Dark</span></label>
        </div>
        <hr class="menu-sep" />
        <button class="menu-item" id="check-updates" type="button" role="menuitem">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
          <span>Check for Updates…</span>
        </button>
        <button class="menu-item menu-check" id="auto-update" type="button" role="menuitemcheckbox" aria-checked="true">
          <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
          <span>Check for updates automatically</span>
        </button>
        <hr class="menu-sep" />
        <button class="menu-item menu-check" id="reopen-tabs" type="button" role="menuitemcheckbox" aria-checked="true">
          <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
          <span>Reopen tabs at start</span>
        </button>
        <button class="menu-item" id="forget-positions" type="button" role="menuitem">
          <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
          <span>Forget remembered positions</span>
        </button>
      </div>

      <!-- The stamps the stamp tool can place. -->
      <div class="menu stamp-menu" id="stamp-menu" role="menu" aria-label="Stamps" hidden></div>

      <!-- What the annotation tools say to a screen reader, and the box for the text of a note. -->
      <div class="vh" id="annot-status" role="status" aria-live="polite"></div>
      <div class="annot-popovers" id="annot-popovers"></div>

      <!-- The menu of the right mouse button on selected text. The menu of the web view is off, because it also holds Reload. -->
      <div class="menu context-menu" id="context-menu" role="menu" aria-label="Selected text" hidden>
        <button class="menu-item" id="context-copy" type="button" role="menuitem"><span>Copy</span></button>
      </div>

      <!-- Holds the selected text so the system's own Copy works. Off screen, but real text. -->
      <div class="sel-proxy" id="sel-proxy" aria-hidden="true"></div>

      <!-- Says how far a long copy has got. Shown only while one runs. -->
      <div class="copy-status" id="copy-status" role="status" aria-live="polite" hidden></div>

      <div class="sheet-layer" id="notice-layer" hidden></div>
    </div>
    <!-- The pages being printed. Hidden on screen; the only thing shown when printing. -->
    <div class="print-root" id="print-root" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
