# cargo-about configuration, used by scripts/notices.sh to make THIRD-PARTY-NOTICES.
#
# `accepted` is the allowlist of licences for everything that ships. A dependency with any other
# licence fails the notices check in CI, for Rust crates (cargo-about) and for npm packages
# (scripts/third-party-notices.mjs reads this same list). Keep it equal to [licenses].allow in
# deny.toml. Strong copyleft is not on it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# Every system the app is built for, so that a crate used on only one of them is listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Build scripts and test code are not in the binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The project's own crates (AGPL-3.0-only, publish = false).
private = { ignore = true }
