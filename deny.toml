# cargo-deny configuration, used by the Audit workflow.
[graph]
all-features = false

[advisories]
# Unmaintained crates that come in through Tauri's Linux stack (gtk3/glib macros) and
# tauri-plugin-single-instance (zbus, D-Bus, Linux only). None is a known vulnerability, none is
# in the engine, and there is no fix until Tauri moves. Drop these when they do.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3/glib macros (Tauri, Linux), build time only" },
    { id = "RUSTSEC-2026-0370", reason = "zbus stack via tauri-plugin-single-instance on Linux; unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus stack via tauri-plugin-single-instance on Linux; unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zbus stack via tauri-plugin-single-instance on Linux; unmaintained, no known vulnerability" },
]

[licenses]
# Licenses of the crates we depend on. Strong copyleft is not on this list. The project's own
# crates (AGPL-3.0-only, publish = false) are private and skipped.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or unknown registry source fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
