[package]
name = "patient-partridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "An open source PDF reader and editor: fast, small, no account, no cloud, no tracking"

[lib]
name = "patient_partridge_lib"
crate-type = ["rlib"]

[features]
# `tauri build` turns this on: the window then loads the built frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
# Test builds only (see scripts/update-e2e.mjs): when the environment variable
# PARTRIDGE_UPDATE_DRIVER names a file, the app checks for an update on its own, installs it the
# way the window would, and writes what happened to that file. Never part of a release build.
update-driver = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# The app process never parses PDFs and must never depend on the PDFium bindings.
# It only knows the protocol and how to supervise the engine process.
[dependencies]
partridge-protocol = { path = "../crates/protocol" }
partridge-engine-client = { path = "../crates/engine-client" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"

[dev-dependencies]
# The test kit makes PDF files for the tests that run real engines.
partridge-testkit = { path = "../crates/testkit" }

# The mock runtime, to run the guard that holds back a close request on a window. Not on Windows:
# the test program of the library does not start there once the mock runtime is part of it (an
# import that needs the manifest of the app), and the guard is the same code on every system.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
