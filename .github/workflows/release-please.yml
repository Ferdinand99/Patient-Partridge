# Keeps a release pull request up to date (version bump and CHANGELOG from Conventional Commits).
# It only runs when started by hand. There is no release process yet: this workflow never builds
# or publishes anything. Merging the pull request it opens would create a tag and a draft release.
name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
