# Keeps a release PR open on main (version bump + CHANGELOG from Conventional Commits).
# Merging it tags vX.Y.Z and creates a DRAFT GitHub release. The draft is only published by the
# `publish` job, after the installers, latest.json and the signatures are attached and checked.
# The release body (the changelog section) becomes the "notes" field of latest.json, which is the
# text of the update question in the app.
#
# Everything runs in this workflow because tags and releases created with GITHUB_TOKEN do not
# trigger other workflows. See docs/updates.md (the one-time setup, and how to recover from a
# release that failed) and docs/signing.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.draft.outputs.release_id }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Look up draft release id
        id: draft
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            echo "::error::Could not find the release for tag $TAG"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # release-please bumps Cargo.toml but cannot update Cargo.lock, which also holds the version of
  # every workspace crate. Without this step every `--locked` command fails on the release PR.
  # Refresh the lockfile on the release PR branch (workspace members only, no dependency bumps).
  lockfile:
    name: Refresh Cargo.lock on the release PR
    needs: release-please
    if: needs.release-please.outputs.pr_branch != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo update --workspace
      # The fuzz crate has a lockfile of its own, with the workspace crates in it at their version.
      - run: cargo update --workspace --manifest-path fuzz/Cargo.toml
      - name: Commit if a lockfile changed
        run: |
          if git diff --quiet -- Cargo.lock fuzz/Cargo.lock; then
            echo "The lockfiles are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock fuzz/Cargo.lock
          git commit -m "chore: refresh Cargo.lock for the release"
          git push

  # Nothing is built before the keys are known to be right: a release signed with a key that does
  # not belong to the public key in the app could never be installed by an update.
  # The secrets are set only on the two steps that read them. `npm ci` runs without any.
  preflight:
    name: Preflight (signing keys)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only tests that the secrets are not empty. No tool runs here but the shell.
      - name: Check the secrets and the public key
        env:
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IN_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          IN_APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          fail=0
          missing=""
          for v in IN_TAURI_SIGNING_PRIVATE_KEY IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing ${v#IN_}"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets; see docs/updates.md:$missing"
            fail=1
          fi
          missing=""
          for v in IN_APPLE_CERTIFICATE IN_APPLE_CERTIFICATE_PASSWORD IN_APPLE_SIGNING_IDENTITY \
                   IN_APPLE_API_ISSUER IN_APPLE_API_KEY IN_APPLE_API_KEY_CONTENT; do
            [ -n "${!v}" ] || missing="$missing ${v#IN_}"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::The macOS app must be signed and notarised. Set these repository secrets (see docs/signing.md):$missing"
            fail=1
          fi
          pubkey=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)
          case "$pubkey" in
            ""|REPLACE_WITH*)
              echo "::error title=Placeholder public key::plugins.updater.pubkey in src-tauri/tauri.conf.json is a placeholder; see docs/updates.md."
              fail=1 ;;
          esac
          if [ "$fail" -ne 0 ]; then
            echo "::error::Release $TAG was NOT built or published. It remains a DRAFT, so nobody gets a release without update files. Fix the problem above, then follow 'Recovering from a failed release' in docs/updates.md."
            exit 1
          fi
          echo "The secrets are there."
      # The update key signs a small file, and the signature is checked against the public key.
      - name: Check that the signing key belongs to the public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          printf 'preflight' > "$RUNNER_TEMP/preflight.txt"
          npx tauri signer sign "$RUNNER_TEMP/preflight.txt" > /dev/null
          if ! node scripts/updater-key.mjs "$RUNNER_TEMP/preflight.txt" "$RUNNER_TEMP/preflight.txt.sig"; then
            echo "::error::Release $TAG was NOT built or published. It remains a DRAFT. See 'Recovering from a failed release' in docs/updates.md."
            exit 1
          fi

  build-release:
    name: Build release (${{ matrix.name }})
    needs: [release-please, preflight]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action adds each system to latest.json by downloading it, changing it and uploading it
      # again. Two jobs doing that at the same time can lose an entry, so the systems go one by
      # one. The publish job checks that all of them are in the end.
      max-parallel: 1
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # An older Ubuntu, so that the AppImage runs on older Linux systems too.
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    defaults:
      run:
        shell: bash
    # No secret is set for the job. Each is set on the one step that reads it, and the steps that
    # run third-party code (npm, the build scripts of the Rust dependencies, Vite, the tools that
    # make the packages) have none. See docs/signing.md ("Where the secrets are").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config file
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The tools that make an AppImage, checked against pinned hashes. The bundler downloads
      # without any check what is not there.
      - name: Fetch the AppImage tools (pinned)
        if: runner.os == 'Linux'
        run: node scripts/linux-tools.mjs

      # Fetches PDFium (checked against the pinned checksum), builds the engine, and writes the
      # config that puts both into the installer. On macOS both are made for both kinds of Mac.
      - name: Prepare the bundle
        env:
          PARTRIDGE_UNIVERSAL: ${{ runner.os == 'macOS' && '1' || '0' }}
          PARTRIDGE_UPDATER_ARTIFACTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: node scripts/prepare-bundle.mjs

      # Compiles the app and runs the frontend build. No secret is in this step.
      - name: Compile
        run: npx tauri build --no-bundle --config src-tauri/tauri.bundle.generated.conf.json ${{ matrix.args }} -- --locked

      # The installers and packages of Windows and Linux, made without any secret. (The macOS
      # bundle is made in the last step, because it must be signed while it is made.)
      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        run: npx tauri bundle --bundles nsis,msi --config src-tauri/tauri.bundle.generated.conf.json
      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: npx tauri bundle --bundles deb,appimage --config src-tauri/tauri.bundle.generated.conf.json

      # The only step with the secrets. Its "tauri script" signs the update files (Windows, Linux)
      # or makes, signs and notarises the macOS bundle and the disk image; tauri-action then
      # uploads what is there and writes latest.json. See scripts/release-build.mjs.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_CONTENT: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_CONTENT || '' }}
        with:
          tauriScript: node scripts/release-build.mjs
          # The release body (the changelog written by release-please) is used as the `notes` of
          # latest.json by the publish job.
          releaseId: ${{ needs.release-please.outputs.release_id }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.bundle.generated.conf.json ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
    steps:
      - name: Verify update assets
        run: |
          assets=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "$assets"
          # latest.json.new is the leftover of an interrupted "Put the changelog into latest.json" run; that step finishes it.
          if ! grep -qxE 'latest\.json(\.new)?' <<< "$assets"; then
            echo "::error::Release $TAG has no latest.json asset; leaving it as a draft."
            exit 1
          fi
          if ! grep -q '\.sig$' <<< "$assets"; then
            echo "::error::Release $TAG has no .sig asset (updater signatures); leaving it as a draft."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # tauri-action leaves `notes` empty when it uploads to an existing release; fill it from the
      # release body (the release-please changelog) so the update question shows what is new.
      - name: Put the changelog into latest.json
        run: |
          # Safe to run again after a failure: the new file is uploaded as latest.json.new first, so
          # latest.json is never missing without a finished replacement next to it, and a run that finds
          # the notes already in place does nothing.
          set -euo pipefail
          api="repos/${{ github.repository }}"
          asset_id() { gh api "$api/releases/$RELEASE_ID" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          gh api "$api/releases/$RELEASE_ID" --jq '.body // ""' > release-body.md

          # Finish an interrupted earlier run first.
          leftover=$(asset_id latest.json.new)
          if [ -n "$leftover" ]; then
            old=$(asset_id latest.json)
            [ -z "$old" ] || gh api -X DELETE "$api/releases/assets/$old"
            gh api -X PATCH "$api/releases/assets/$leftover" -f name=latest.json > /dev/null
            echo "Finished an interrupted update of latest.json."
          fi

          id=$(asset_id latest.json)
          if [ -z "$id" ]; then
            echo "::error::Release $TAG has no latest.json asset."
            exit 1
          fi
          gh api "$api/releases/assets/$id" -H "Accept: application/octet-stream" > latest.json
          node scripts/update-notes.mjs latest.json release-body.md latest.new.json
          node -e 'const j=require("./latest.new.json"); if(!j.notes){console.error("::error::latest.json would still have empty notes"); process.exit(1)}'
          if node -e 'process.exit(require("./latest.json").notes === require("./latest.new.json").notes ? 0 : 1)'; then
            echo "latest.json already carries the changelog."
            exit 0
          fi
          new_id=$(curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.new.json \
            "https://uploads.github.com/$api/releases/$RELEASE_ID/assets?name=latest.json.new" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
          gh api -X DELETE "$api/releases/assets/$id"
          gh api -X PATCH "$api/releases/assets/$new_id" -f name=latest.json > /dev/null
          echo "latest.json now carries the changelog."
      # Every system must be in latest.json with a signature and an asset, or the release stays a draft.
      - name: Check latest.json
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}"
          gh api "$api/releases/$RELEASE_ID" --jq '[.assets[] | {id, name}]' > assets.json
          id=$(gh api "$api/releases/$RELEASE_ID" --jq '.assets[] | select(.name == "latest.json") | .id')
          gh api "$api/releases/assets/$id" -H "Accept: application/octet-stream" > latest.final.json
          node scripts/check-latest.mjs latest.final.json assets.json "${TAG#v}"
      - name: Publish release
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true
          echo "Published $TAG."
