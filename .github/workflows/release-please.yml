# Keeps a release pull request up to date (version bump and CHANGELOG from Conventional Commits).
# It only runs when started by hand. There is no release process yet: this workflow never builds
# or publishes anything. Merging the pull request it opens does not create a tag; a later run of
# this workflow does that (and a draft release).
name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps Cargo.toml but cannot update Cargo.lock, which also holds the version of
  # every workspace crate. Without this step every `--locked` command fails on the release PR.
  # Refresh the lockfile on the release PR branch (workspace members only, no dependency bumps).
  lockfile:
    name: Refresh Cargo.lock on the release PR
    needs: release-please
    if: needs.release-please.outputs.pr_branch != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo update --workspace
      - name: Commit if the lockfile changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for the release"
          git push
