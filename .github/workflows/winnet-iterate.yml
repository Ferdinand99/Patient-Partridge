name: Windows network block (iteration)

on:
  push:
    branches: [feat/windows-network-block]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-iterate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/fetch-pdfium.mjs
      - run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html
      - name: Build
        run: cargo test -p partridge-engine --locked --no-run
      - name: How starts end with layers taken away
        continue-on-error: true
        run: cargo test -p partridge-engine --locked --test windows_start_variants -- --ignored --nocapture
      - name: Access lists after the run
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          icacls target\debug
          icacls target\debug\partridge-engine.exe
          icacls vendor\pdfium\win-x64
