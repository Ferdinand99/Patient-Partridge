name: Windows network block (iteration)

on:
  push:
    branches: [feat/windows-network-block]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-iterate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/fetch-pdfium.mjs
      - run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html
      - name: Dynamic CRT, no pinning, starts under load
        continue-on-error: true
        timeout-minutes: 8
        env:
          PARTRIDGE_DIAG_NO_PIN: "1"
        run: cargo test -p partridge-engine --locked --test windows_start -- --nocapture --test-threads 2
      - name: Static CRT, no pinning, starts under load
        continue-on-error: true
        timeout-minutes: 10
        env:
          PARTRIDGE_DIAG_NO_PIN: "1"
          RUSTFLAGS: "-C target-feature=+crt-static"
          CARGO_TARGET_DIR: target-static
        run: |
          cargo test -p partridge-engine --locked --test windows_start --no-run
          DUMPBIN=$(find "/c/Program Files/Microsoft Visual Studio" -name dumpbin.exe -path "*Hostx64*x64*" | head -1)
          "$DUMPBIN" //dependents target-static/debug/partridge-engine.exe || true
          cargo test -p partridge-engine --locked --test windows_start -- --nocapture --test-threads 2
