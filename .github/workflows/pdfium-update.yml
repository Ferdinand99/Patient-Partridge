# Looks twice a week for a newer PDFium build than the one pinned in pdfium.lock.json, and keeps
# ONE open issue about it. PDFium is the main attack surface of the app, so a new release must not
# go unnoticed, and a reminder that repeats every week would be ignored. The steps to update are in
# docs/pdfium-updates.md.
name: PDFium update check

on:
  schedule:
    - cron: "41 8 * * 2,5"
  workflow_dispatch:

# No rights by default. The two jobs below ask for exactly what they need.
permissions: {}

jobs:
  check:
    name: Compare with the latest release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      outdated: ${{ steps.compare.outputs.outdated }}
      title: ${{ steps.compare.outputs.title }}
      body: ${{ steps.compare.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Fails (visibly) when the release list can not be read, when the latest tag has an
      # unexpected shape, or when pdfium.lock.json and the pdfium-render feature disagree.
      - name: Compare
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pdfium-update-check.mjs

  report:
    name: Open or update the issue
    needs: check
    if: needs.check.outputs.outdated == 'true'
    runs-on: ubuntu-24.04
    # The only job that can write, and the only thing it can write is an issue.
    permissions:
      issues: write
    steps:
      # One open issue at a time. The title and body come from the previous job, which builds them
      # only from a tag that matched chromium/<digits> and from numbers. They are still treated as
      # data: they reach this script through environment variables only and are never put into the
      # shell text, and nothing from the release itself is used.
      #   - An open issue with the prefix exists: its title and body are replaced by the newest
      #     build. No new issue.
      #   - None is open, but an issue with exactly this title exists (closed): the owner decided to
      #     skip this build. Nothing is opened.
      #   - Otherwise a new issue is opened.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.check.outputs.title }}
          BODY: ${{ needs.check.outputs.body }}
        run: |
          open_json=$(gh issue list --state open --limit 100 --search '"PDFium update available:" in:title' --json number,title)
          open_number=$(printf '%s' "$open_json" | jq -r '[.[] | select(.title | startswith("PDFium update available:"))] | sort_by(.number) | reverse | .[0].number // empty')
          if [ -n "$open_number" ]; then
            open_title=$(printf '%s' "$open_json" | jq -r --argjson n "$open_number" '.[] | select(.number == $n) | .title')
            if [ "$open_title" = "$TITLE" ]; then
              echo "Issue #$open_number is open and already names this build."
            else
              gh issue edit "$open_number" --title "$TITLE" --body "$BODY"
              echo "Updated issue #$open_number to: $TITLE"
            fi
            exit 0
          fi
          skipped=$(gh issue list --state closed --limit 100 --search '"PDFium update available:" in:title' --json title --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$skipped" != "0" ]; then
            echo "An issue for this build was closed: it is skipped. $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY"
