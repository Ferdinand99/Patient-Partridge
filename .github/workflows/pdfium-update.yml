# Looks twice a week for a newer PDFium build than the one pinned in pdfium.lock.json, and keeps
# ONE open issue about it. PDFium is the main attack surface of the app, so a new release must not
# go unnoticed, and a reminder that repeats every week would be ignored. The steps to update are in
# docs/pdfium-updates.md.
name: PDFium update check

on:
  schedule:
    - cron: "41 8 * * 2,5"
  workflow_dispatch:

# No rights by default. The two jobs below ask for exactly what they need.
permissions: {}

jobs:
  check:
    name: Compare with the latest release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      outdated: ${{ steps.compare.outputs.outdated }}
      title: ${{ steps.compare.outputs.title }}
      body: ${{ steps.compare.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Fails (visibly) when the release list can not be read, when the latest tag has an
      # unexpected shape, or when pdfium.lock.json and the pdfium-render feature disagree.
      - name: Compare
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pdfium-update-check.mjs

  report:
    name: Open or update the issue
    needs: check
    if: needs.check.outputs.outdated == 'true'
    runs-on: ubuntu-24.04
    # The only job that can write, and the only thing it can write is an issue.
    permissions:
      issues: write
    steps:
      # One open issue at a time. The title and body come from the previous job, which builds them
      # only from a tag that matched chromium/<digits>, from numbers and from a plain version
      # number. They are still treated as data: they reach this script through environment
      # variables only and are never put into the shell text, and nothing from the release itself
      # is used.
      # Only issues that this workflow wrote count (--author app/github-actions): the repository is
      # public, anyone can open an issue with any title and close it, and that must not be able to
      # switch off the alert for a build or to take over the issue.
      #   - An open issue of the workflow with the prefix exists: its title and body are replaced by
      #     the newest build, and a comment says so (a changed title sends no notification, a
      #     comment does). No new issue.
      #   - None is open, but an issue of the workflow with exactly this title was closed as "not
      #     planned": the owner decided to skip this build. Nothing is opened. An issue that was
      #     closed as completed (a merged update that says "Closes #N") does not skip anything:
      #     the issue may have been renamed to a newer build after the work started.
      #   - Otherwise a new issue is opened.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.check.outputs.title }}
          BODY: ${{ needs.check.outputs.body }}
        run: |
          open_json=$(gh issue list --state open --author app/github-actions --limit 100 --search '"PDFium update available:" in:title' --json number,title)
          open_number=$(printf '%s' "$open_json" | jq -r '[.[] | select(.title | startswith("PDFium update available:"))] | sort_by(.number) | reverse | .[0].number // empty')
          if [ -n "$open_number" ]; then
            open_title=$(printf '%s' "$open_json" | jq -r --argjson n "$open_number" '.[] | select(.number == $n) | .title')
            if [ "$open_title" = "$TITLE" ]; then
              echo "Issue #$open_number is open and already names this build."
            else
              gh issue edit "$open_number" --title "$TITLE" --body "$BODY"
              gh issue comment "$open_number" --body "A newer PDFium build is out. This issue now names: $TITLE"
              echo "Updated issue #$open_number to: $TITLE"
            fi
            exit 0
          fi
          skipped=$(gh issue list --state closed --author app/github-actions --limit 100 --search '"PDFium update available:" in:title' --json title,stateReason --jq '[.[] | select(.title == env.TITLE and .stateReason == "NOT_PLANNED")] | length')
          if [ "$skipped" != "0" ]; then
            echo "An issue for this build was closed: it is skipped. $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY"
