name: CI

on:
  push:
    branches: [main]
  # Every pull request is checked, also one that is based on another branch of a series.
  pull_request:
  workflow_dispatch:

# Pull requests are checked by the pull_request event only, so a push to a PR branch runs CI
# once. A newer push cancels the older run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The test programs are many and each links the engine; the line tables are enough for a
  # backtrace and keep the build folder small enough for the disk of a runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            lint: true
          - name: windows
            os: windows-latest
            lint: false
          # Windows Server 2022 (build 20348) is closer to Windows 10 and 11 than the newest
          # image: the token calls and the list of known libraries that the sandbox depends on can
          # differ between versions.
          - name: windows-2022
            os: windows-2022
            lint: false
          - name: macos
            os: macos-latest
            lint: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The test builds fill the disk of a runner; software the job does not use is taken off while
      # the job goes on with the rest (removing it takes minutes).
      - name: Make room on the disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
          df -h /
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config \
            fonts-noto-cjk fonts-noto-core fonts-dejavu-core
      # A second reader for the files the engine writes: qpdf checks their structure, and Poppler
      # opens and draws them (crates/engine/tests/annots_readers.rs). On Linux the tests insist
      # that both are there.
      - name: Install the second readers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y qpdf poppler-utils
          echo "PARTRIDGE_REQUIRE_READERS=1" >> "$GITHUB_ENV"
      # A third reader for the files that signing with a certificate makes: pyHanko, a validator of
      # signed PDFs written by someone else, pinned like everything else
      # (crates/engine/tests/sign_readers.rs).
      - name: Install the validator of signatures (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/pyhanko"
          "$RUNNER_TEMP/pyhanko/bin/pip" install --no-cache-dir pyhanko==0.38.0 pyhanko-certvalidator==0.33.0
          echo "PARTRIDGE_PYHANKO_PYTHON=$RUNNER_TEMP/pyhanko/bin/python" >> "$GITHUB_ENV"
          echo "PARTRIDGE_REQUIRE_PYHANKO=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The engine tests run the real PDFium library. The download is checked against the
      # checksum pinned in pdfium.lock.json before it is unpacked.
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs
      # The tauri crate embeds ../dist at compile time; a stub is enough for lint and tests.
      # Ubuntu 24.04 lets a program make a user namespace but takes the rights in it away (an
      # AppArmor rule). The engine's empty root needs those rights, so the rule is switched off for
      # the run, and the tests then insist that the engine reports the layer.
      - name: Allow user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "PARTRIDGE_TEST_REQUIRE_EMPTY_ROOT=1" >> "$GITHUB_ENV"
      - name: Create stub dist/
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html
      - name: Format
        if: matrix.lint
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The test builds of the update test (scripts/update-e2e.mjs) turn this feature on.
      - name: Clippy (update driver)
        if: matrix.lint
        run: cargo clippy -p patient-partridge --all-targets --features update-driver --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # A save on a disk with no room left leaves the file as it was. Needs a small file system.
      - name: Full disk test (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=1m,mode=1777 tmpfs /mnt/small
          PARTRIDGE_TEST_SMALL_DISK=/mnt/small cargo test -p partridge-engine-client --locked -- --ignored a_full_disk
      # What the engine tried after it locked itself in (open a file, connect, send, look up a name, start a program,
      # write a file) and what the system answered, on each system.
      - name: Sandbox proof
        if: always()
        run: cargo test -p partridge-engine --locked --test sandbox -- --nocapture --test-threads 1
      # The seccomp filter is the base on Linux and Landlock only an extra. Run the engine tests
      # once more with Landlock switched off, so the filter alone is shown to be enough.
      - name: Engine tests with seccomp alone
        if: always() && runner.os == 'Linux'
        env:
          PARTRIDGE_TEST_NO_LANDLOCK: "1"
        run: cargo test -p partridge-engine -p partridge-engine-client --locked
      # With the empty root the engine counts as a process with one thread without a look, so the
      # tests above cannot tell whether Landlock is applied before the first helper thread starts.
      # Without the empty root the engine counts its threads, and the greeting names Landlock only
      # when there was one. The step runs the greeting test that way, with the rule that insists on
      # the empty root taken away, and fails first if this kernel does not list Landlock (the test
      # would pass without looking then).
      - name: Landlock before the threads (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          if ! tr ',' '\n' < /sys/kernel/security/lsm | grep -qx landlock; then
            echo "This kernel does not list Landlock, so the order of Landlock and the threads is not tried." >&2
            exit 1
          fi
          env -u PARTRIDGE_TEST_REQUIRE_EMPTY_ROOT PARTRIDGE_TEST_NO_EMPTY_ROOT=1 \
            cargo test -p partridge-engine --locked --test sandbox -- --exact --nocapture \
            the_real_engine_reports_the_sandbox_it_runs_in
      # A page in each script that needs a system font, drawn with the fonts of this system (what
      # the runner image has, and the Noto packages on Linux). The test says for each script which
      # file the app handed over, or that this system has none, and fails if the runner has none.
      - name: System fonts proof
        if: always()
        env:
          PARTRIDGE_REQUIRE_FONT_SCRIPTS: all
        run: cargo test -p partridge-engine --locked --test system_fonts -- --nocapture --test-threads 1
      - name: The sandbox log (macOS)
        if: failure() && runner.os == 'macOS'
        run: log show --last 10m --predicate 'sender == "Sandbox"' --style compact | grep -i 'engine|partridge' | tail -100 || true
      # The test switches and the self-test program exist in debug builds only.
      - name: The release engine has no test code
        if: matrix.lint
        run: |
          cargo build --release --locked -p partridge-engine
          if grep -aq 'PARTRIDGE_TEST_' target/release/partridge-engine; then
            echo "The release engine contains test switches." >&2
            exit 1
          fi
          ls target/release/examples 2>/dev/null | grep -q selftest && { echo "The self-test program was built in release." >&2; exit 1; }
          echo "ok: no test switches in the release engine"
      - name: The release signer has no test code
        if: matrix.lint
        run: |
          cargo build --release --locked -p partridge-signer
          if grep -aq 'PARTRIDGE_TEST_' target/release/partridge-signer; then
            echo "The release signer contains test switches." >&2
            exit 1
          fi
          echo "ok: no test switches in the release signer"
      - name: The engine has no network code, the app does not link PDFium
        if: matrix.lint
        run: scripts/check-engine-deps.sh

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # THIRD-PARTY-NOTICES lists the licence texts of the Rust crates and npm packages in the app.
  # It is made from the dependencies (scripts/notices.sh), so a changed dependency makes it stale:
  # this job fails then. It also fails when a dependency has a licence that is not on the
  # allowlist in about.toml.
  notices:
    name: Third-party notices (up to date, licences allowed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pinned version and pinned checksum. Keep the version equal to want_version in
      # scripts/notices.sh.
      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: "0.9.3"
          CARGO_ABOUT_SHA256: "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4"
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "${name}/cargo-about"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # --fail is what makes an unreadable licence stop the check; this test proves it.
      - name: cargo-about stops on a crate with an unreadable licence
        run: scripts/test-notices-fail.sh
      - name: THIRD-PARTY-NOTICES is up to date
        run: scripts/notices.sh --check

  # A form that was filled in and saved by the engine, and a form that the designer made, are handed
  # to tools that are not PDFium: qpdf checks the structure, pdftk reads the field values, poppler
  # draws the page. See scripts/check-forms.sh and crates/engine/tests/author_readers.rs.
  forms-tools:
    name: Filled forms read by other tools (qpdf, pdftk, poppler)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: forms-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf pdftk-java poppler-utils
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs
      # The engine tests that use the sandbox need the same switch as the Rust job (see there).
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "PARTRIDGE_TEST_REQUIRE_EMPTY_ROOT=1" >> "$GITHUB_ENV"
      - name: Fill in and save the test forms
        env:
          PARTRIDGE_FORMS_OUT: ${{ runner.temp }}/forms
        run: cargo test -p partridge-engine --locked --test forms --test forms_process --test forms_actions
      - name: Read them with other tools
        run: scripts/check-forms.sh "$RUNNER_TEMP/forms"
      # Forms that the designer made (fields of every kind, on a plain page and on turned pages) are
      # read by qpdf (the structure), Poppler (opens and draws every field and what was filled in)
      # and pdftk (kinds, flags, tooltips, states and defaults; fills them in, and the engine reads
      # what it wrote). Each of the tools must be there.
      - name: Forms made by the designer, read with other tools
        env:
          PARTRIDGE_REQUIRE_READERS: "1"
          PARTRIDGE_REQUIRE_PDFTK: "1"
        run: cargo test -p partridge-engine --locked --test author_readers

  # Documents that the page tools changed and saved (a delete, a move, a turn, a crop, an insert and a
  # copy of some pages) are handed to tools that are not PDFium: qpdf checks the structure, poppler
  # reads the pages and draws them, and the bytes of a deleted page are searched for. See
  # scripts/check-pages.sh.
  pages-tools:
    name: Changed pages read by other tools (qpdf, poppler)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: pages-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs
      # The engine tests that use the sandbox need the same switch as the Rust job (see there).
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "PARTRIDGE_TEST_REQUIRE_EMPTY_ROOT=1" >> "$GITHUB_ENV"
      - name: Change and save the test documents
        env:
          PARTRIDGE_PAGES_OUT: ${{ runner.temp }}/pages
        run: cargo test -p partridge-engine --locked --test pages_process
      - name: Read them with other tools
        run: scripts/check-pages.sh "$RUNNER_TEMP/pages"
      # The check can fail: given a file that still holds the text of a page it was told is gone, it
      # must say so.
      - name: The check fails on a page that was not deleted
        run: |
          mkdir "$RUNNER_TEMP/negative"
          cp "$RUNNER_TEMP/pages/original.pdf" "$RUNNER_TEMP/negative/deleted.pdf"
          printf '%s\t%s\t%s\n' deleted.pdf 5 gone=1 > "$RUNNER_TEMP/negative/expected.txt"
          if scripts/check-pages.sh "$RUNNER_TEMP/negative" >"$RUNNER_TEMP/negative.txt" 2>&1; then
            cat "$RUNNER_TEMP/negative.txt"
            echo "The check passed a page that was not deleted." >&2
            exit 1
          fi
          grep -q "still has the text of deleted page 1" "$RUNNER_TEMP/negative.txt"

  # The real window code in a real browser (Chromium), with the content security policy of the app
  # and a stand-in for the Rust side. See e2e/.
  browser:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      # Pictures of the window in the light and the dark look, for review.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-screenshots
          path: e2e/artifacts/*.png
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.name }})
    needs: [rust, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            bundles: deb,appimage
          - name: windows
            os: windows-latest
            bundles: msi,nsis
          - name: macos
            os: macos-latest
            bundles: app,dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config xvfb
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: build-${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fetches PDFium (checksum checked), builds the engine, and builds the installers with the
      # engine and the library inside. This is a build for testing: nothing is signed or released.
      # The tools that make the AppImage, checked against pinned hashes (the bundler would download
      # them without a check).
      - name: Fetch the AppImage tools (pinned)
        if: runner.os == 'Linux'
        run: node scripts/linux-tools.mjs
      - name: Build installers
        run: npm run bundle -- --bundles ${{ matrix.bundles }} -- --locked

      # The test switches and the self-test code exist in debug builds only; the engine in the
      # installers must have none of them, on every system.
      - name: The engine in the installers has no test code
        run: |
          bin=target/release/partridge-engine
          [ "$RUNNER_OS" = "Windows" ] && bin=target/release/partridge-engine.exe
          if grep -aq 'PARTRIDGE_TEST_' "$bin"; then
            echo "The release engine contains test switches." >&2
            exit 1
          fi
          echo "ok: no test switches in $bin"
          bin=target/release/partridge-signer
          [ "$RUNNER_OS" = "Windows" ] && bin=target/release/partridge-signer.exe
          if grep -aq 'PARTRIDGE_TEST_' "$bin"; then
            echo "The release signer contains test switches." >&2
            exit 1
          fi
          echo "ok: no test switches in $bin"

      # The test driver of the update test (a Cargo feature) must not be in a build that is shipped.
      - name: The release build has no update test driver
        run: |
          BIN=target/release/patient-partridge
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/patient-partridge.exe
          if grep -aq PARTRIDGE_UPDATE_DRIVER "$BIN"; then
            echo "::error::The app was built with the update-driver feature."
            exit 1
          fi

      - name: Collect installers
        run: |
          mkdir -p out
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      # Look inside the installers, not at the build configuration: the PDFium library that a user
      # gets must be the build without V8 (the lock only pins the asset name). The installers are
      # unpacked the way a user's system would, then every library found is searched for V8.
      - name: Unpack the installers
        run: scripts/unpack-installer.sh ${{ matrix.name }} out "$RUNNER_TEMP/unpacked"
      - name: The shipped PDFium has no V8
        run: node scripts/check-pdfium-v8.mjs "$RUNNER_TEMP/unpacked"

      # Runs the built app on a generated 500-page PDF. It must draw the first page; this proves
      # that the engine, the PDFium library and the app policy work together in a release build.
      - name: Make a test PDF
        run: cargo run --release --locked -p partridge-testkit --bin make-pdf -- 500 "$RUNNER_TEMP/test-500.pdf"
      - name: The release engine on its own (diagnosis)
        if: always() && runner.os == 'Linux'
        run: cargo run --release --locked -p partridge-engine --example cold_open -- "$RUNNER_TEMP/test-500.pdf" 1 || true
      - name: Open the PDF in the release build
        run: |
          BIN=target/release/patient-partridge
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/patient-partridge.exe
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node scripts/smoke.mjs --bin "$BIN" --pdf "$RUNNER_TEMP/test-500.pdf" --runs 3 --memory | tee smoke.txt
          else
            node scripts/smoke.mjs --bin "$BIN" --pdf "$RUNNER_TEMP/test-500.pdf" --runs 3 --memory | tee smoke.txt
          fi
          {
            echo "### Open a 500-page PDF (${{ matrix.name }})"
            echo
            echo '```'
            cat smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The app must be registered as a viewer for PDF files in what the build made. On Linux the
      # desktop file must pass the file to the app (%F) and end its MimeType list with ';', or
      # opening a PDF from a file manager starts an empty app. On macOS the Info.plist must name
      # the PDF type, and on Windows the installer must register the .pdf extension.
      - name: Check the file association (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x out/*.deb "$RUNNER_TEMP/deb"
          node scripts/association.mjs linux "$RUNNER_TEMP/deb"
          # The AppImage has its own desktop file (it is made from the same template).
          node scripts/association.mjs linux "$RUNNER_TEMP/unpacked/appimage/usr/share/applications"
      - name: Check the file association (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          node scripts/association.mjs macos "$app"
      - name: Check the file association (Windows)
        if: runner.os == 'Windows'
        run: |
          msi=$(find target/release/bundle/msi -name '*.msi' | head -n1)
          node scripts/association.mjs windows "$msi"

      # The legal texts must be inside the installers a user gets: THIRD-PARTY-NOTICES, the AGPL
      # text (tauri's licenseFile only reaches the msi and nsis dialogs, so the deb gets a
      # Debian copyright file and every system gets LICENSE in the app's resource folder), and the
      # PDFium licence texts. This uses the folder of the "Unpack the installers" step above (one
      # folder per format: deb, dmg, or msi and nsis). Each format is checked on its own, and the
      # files in it are compared with the repository and with the PDFium download.
      - name: The installers carry the licence texts
        run: node scripts/check-installer-legal.mjs ${{ matrix.name }} "$RUNNER_TEMP/unpacked"

      - name: Installer sizes
        if: always()
        run: |
          {
            echo "### Installer sizes (${{ matrix.name }})"
            echo
            echo "| File | MiB |"
            echo "|---|---:|"
            for f in out/*; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(awk -v b="$(wc -c < "$f")" 'BEGIN{printf "%.2f", b/1048576}') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The runners of GitHub run everything as an administrator, and a user of the app usually is not
  # one. This job makes a local standard user, installs the NSIS installer of the Build job as
  # that user, opens PDFs with the installed app (one with a space and letters outside ASCII in
  # its path), and runs the sandbox tests of the engine as that user. Steps and limits are in
  # scripts/windows-standard-user and docs/windows-standard-user.md.
  windows-standard-user:
    name: Windows, as a standard user (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: standard-user-${{ matrix.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # The user and its folders come first, so that everything built later inherits the right
      # permissions. The password is made here, masked, and kept only in this job.
      - name: Create the standard user
        shell: powershell
        run: ./scripts/windows-standard-user/prepare.ps1

      # The installer is the one the Build job made in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-windows
          path: installers
      - name: Fetch PDFium and make a test PDF
        shell: bash
        run: |
          node scripts/fetch-pdfium.mjs
          cargo run --release --locked -p partridge-testkit --bin make-pdf -- 3 "C:/pp/docs/plain.pdf"
      - name: Put the installer and PDFium where the user can read them
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'The Build job made no NSIS installer.' }
          Copy-Item $setup.FullName C:\pp\in\
          $msi = Get-ChildItem installers -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'The Build job made no MSI.' }
          Copy-Item $msi.FullName C:\pp\in\
          $library = Get-ChildItem vendor/pdfium -Recurse -Filter pdfium.dll | Select-Object -First 1
          Copy-Item "$($library.DirectoryName)\*" C:\pp\pdfium\ -Recurse
          Get-ChildItem C:\pp\in, C:\pp\pdfium | Format-Table Name, Length

      # Debug builds of the test programs of the engine, in C:\pp\build.
      - name: Build the engine tests
        shell: pwsh
        run: ./scripts/windows-standard-user/build-tests.ps1

      # What a deployment tool or an administrator does: install in a folder outside Program Files,
      # as an administrator. The files then belong to the administrators, and the standard user who
      # runs the program cannot change who may read them. The installers add the entry for the
      # engine's package themselves; the third copy has none (a control: the engine must fail there,
      # which is what every installation outside Program Files did before the installers did this).
      - name: Install outside the profile, as an administrator
        shell: pwsh
        run: ./scripts/windows-standard-user/install-as-admin.ps1

      - name: Run the checks as the standard user
        shell: powershell
        run: ./scripts/windows-standard-user/run-as-user.ps1

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $log = 'C:\pp\out\child.log'
          if (Test-Path $log) {
            '### Windows, as a standard user' | Add-Content $env:GITHUB_STEP_SUMMARY
            '' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Encoding UTF8 |
              Where-Object { $_ -match '^\[(PASS|FAIL)\]|^(user|process session|window station|desktop|token elevated|SESSIONNAME|FAILED|ALL CHECKS|report:|engine process)' } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: standard-user-logs-${{ matrix.os }}
          path: C:\pp\out\*
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the standard user
        if: always()
        shell: powershell
        run: |
          if ($env:PP_USER) { Remove-LocalUser -Name $env:PP_USER -ErrorAction SilentlyContinue }

  # The engine proves the network block with real attempts at start-up. That proof depends on the
  # Windows Filtering Platform, which the firewall profiles, the firewall service (MpsSvc) and the
  # filtering engine (BFE) feed. This job puts the runner in each of those states and records what
  # the engine does: it must open the document in all of them, and it must say truthfully whether it
  # could prove the block (docs/windows-sandbox.md).
  windows-capture:
    name: Windows, packet capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: capture-${{ matrix.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs
      - name: Build the tests
        run: |
          cargo build -p partridge-engine --examples --locked
          cargo test -p partridge-engine --locked --no-run --test sandbox
      # pktmon is the packet monitor of Windows. It shows whether a raw echo request that a
      # program sends leaves for the network card; the control shows that the capture sees it.
      - name: Raw echo requests under pktmon
        run: ./scripts/windows-packet-capture.ps1
      - name: Stop the capture
        if: always()
        run: |
          pktmon stop 2>&1 | Out-Null
          pktmon filter remove 2>&1 | Out-Null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: capture-${{ matrix.os }}
          path: logs/*
          if-no-files-found: ignore
          retention-days: 7

  windows-firewall:
    name: Windows, firewall state (${{ matrix.state }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # In every state that a hosted runner allows, the engine still proves the block: TCP,
          # UDP and raw sockets are refused. (The script fails when the runner did not reach the
          # state, so a green leg is a state that was made.)
          - { os: windows-latest, state: default, expect: proved }
          - { os: windows-latest, state: profiles-off, expect: proved }
          - { os: windows-latest, state: outbound-allowed, expect: proved }
          - { os: windows-latest, state: package-allowed, expect: proved }
          - { os: windows-latest, state: loopback-exempt, expect: proved }
          - { os: windows-2022, state: default, expect: proved }
          - { os: windows-2022, state: profiles-off, expect: proved }
          # Not in the list, on purpose: a hosted runner refuses to stop the firewall service
          # (MpsSvc) or the filtering engine (BFE), for an administrator and for the system account
          # alike, so a leg for either would run in the default state. The script has both states
          # and fails when the service is still running, for a runner that allows it.
          # A debug engine told to take the answer of the network check as one that is not "blocked":
          # the whole path after it (greeting, client, document) must work and say so.
          - { os: windows-latest, state: simulated-answer, expect: not-proved }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: firewall-${{ matrix.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs
      - name: Build the tests
        run: |
          cargo build -p partridge-engine --examples --locked
          cargo test -p partridge-engine --locked --no-run --test sandbox --test windows_start --test windows_network_states --test sandbox_refusal
      - name: Put the runner in the state
        run: ./scripts/windows-firewall-state.ps1 ${{ matrix.state }}
      # A native command's exit code is checked by hand: a pipe into Tee-Object hides it.
      - name: What the engine does in this state
        env:
          PARTRIDGE_FIREWALL_STATE: ${{ matrix.state }}
          PARTRIDGE_NETWORK_EXPECT: ${{ matrix.expect }}
          PARTRIDGE_TEST_NETWORK_UNPROVED: ${{ matrix.state == 'simulated-answer' && '1' || '' }}
        run: |
          cargo test -p partridge-engine --locked --test windows_network_states -- --nocapture 2>&1 | Tee-Object -FilePath logs/engine.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The sandbox proof in this state
        if: matrix.state != 'simulated-answer'
        run: |
          cargo test -p partridge-engine --locked --test sandbox -- --nocapture --test-threads 1 2>&1 | Tee-Object -FilePath logs/sandbox.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Many starts in this state
        env:
          PARTRIDGE_TEST_NETWORK_UNPROVED: ${{ matrix.state == 'simulated-answer' && '1' || '' }}
        run: |
          cargo test -p partridge-engine --locked --test windows_start -- --nocapture 2>&1 | Tee-Object -FilePath logs/starts.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Put the services back
        if: always()
        run: |
          Set-NetFirewallProfile -Profile Domain, Public, Private -Enabled True -ErrorAction SilentlyContinue
          Start-Service BFE -ErrorAction SilentlyContinue
          Start-Service MpsSvc -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: firewall-${{ matrix.os }}-${{ matrix.state }}
          path: logs/*
          if-no-files-found: ignore
          retention-days: 7
