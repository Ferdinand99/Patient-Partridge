version: 2
updates:
  # Rust crates: one grouped PR a week for minor and patch updates;
  # security updates come on their own as soon as an advisory is out.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  # The fuzz crate has its own lock file and is not part of the workspace above.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      fuzz-cargo:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # `typescript` is the copy that typescript-eslint uses (its peer range stops below 6.1), so
      # it stays on 6.0.x. TypeScript 7 has no JavaScript compiler API; it is installed under the
      # name `typescript-native` and runs the type check only. Dependabot does not read npm
      # aliases, so that version is raised by hand. Remove this ignore (and the alias, see
      # package.json) once typescript-eslint supports TypeScript 7.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    ignore:
      # Its tag picks the Rust version (rust-toolchain@1.99); a "newer tag"
      # is a different toolchain, not an update of the action.
      - dependency-name: dtolnay/rust-toolchain
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
