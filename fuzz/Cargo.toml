[package]
name = "partridge-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Fuzz targets for the Patient Partridge protocol decoders and the PDF engine"

[package.metadata]
cargo-fuzz = true

[lib]
name = "partridge_fuzz"
path = "src/lib.rs"

[dependencies]
# Pinned. The fuzz crate has its own lock file (fuzz/Cargo.lock) and is not part of the main
# workspace, so it never changes what the app is built from.
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", features = ["derive"] }
partridge-protocol = { path = "../crates/protocol" }
partridge-engine = { path = "../crates/engine" }
partridge-signer = { path = "../crates/signer" }
partridge-signer-protocol = { path = "../crates/signer-protocol" }
partridge-testkit = { path = "../crates/testkit" }

[[bin]]
name = "make-seeds"
path = "src/bin/make-seeds.rs"
test = false
doc = false

[[bin]]
name = "protocol_request_decode"
path = "fuzz_targets/protocol_request_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_response_decode"
path = "fuzz_targets/protocol_response_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_read_frame"
path = "fuzz_targets/protocol_read_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_roundtrip_request"
path = "fuzz_targets/protocol_roundtrip_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_roundtrip_response"
path = "fuzz_targets/protocol_roundtrip_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_open_render"
path = "fuzz_targets/engine_open_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "form_author"
path = "fuzz_targets/form_author.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_check"
path = "fuzz_targets/signature_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signer_protocol"
path = "fuzz_targets/signer_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signer_load"
path = "fuzz_targets/signer_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sign_prepare"
path = "fuzz_targets/sign_prepare.rs"
test = false
doc = false
bench = false

# Same release settings as the app where they matter for finding bugs; overflow checks stay on
# so that integer overflows in the decoders are reported instead of wrapping.
[profile.release]
debug = 1
overflow-checks = true
panic = "unwind"

[workspace]
