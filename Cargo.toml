[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/engine-client",
    "crates/testkit",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Ferdinand99/Patient-Partridge"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

# Big number arithmetic makes the RSA keys of the signature tests; it is slow without
# optimisation, and these tests run in the dev profile.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3
