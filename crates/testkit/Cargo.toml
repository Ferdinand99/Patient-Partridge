[package]
name = "partridge-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Test support for Patient Partridge: generates small PDF files and finds the PDFium folder"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
md-5 = "=0.11.0"
# Signed test files (src/signed.rs): keys, certificates and signatures are made in the tests.
ring = "=0.17.14"
num-bigint = "=0.4.6"

[[bin]]
name = "make-pdf"
path = "src/bin/make-pdf.rs"
