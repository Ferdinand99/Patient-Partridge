[package]
name = "partridge-engine-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Starts and talks to the Patient Partridge PDF engine process and survives its crashes"

[dependencies]
partridge-protocol = { path = "../protocol" }
partridge-signer-protocol = { path = "../signer-protocol" }
# SHA-256 and SHA-384 of the part of a file that is signed. The same library the engine and the
# signer use; it has no network code.
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
# The password and the messages that carry it are overwritten after use.
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
partridge-testkit = { path = "../testkit" }
