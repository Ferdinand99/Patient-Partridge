[package]
name = "partridge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Patient Partridge PDF engine: parses and renders PDFs in its own process, no network"

[lib]
name = "partridge_engine"
path = "src/lib.rs"

[[bin]]
name = "partridge-engine"
path = "src/main.rs"

[dependencies]
partridge-protocol = { path = "../protocol" }
partridge-sandbox = { path = "../sandbox" }
# The PDFium version feature must match the binary pinned in pdfium.lock.json.
# No default features: no `image` crate and no thread-safe wrapper (the engine is single threaded).
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125"] }

# Digital signatures (see src/sigcheck.rs): the structures are read with RustCrypto's crates and the
# signature arithmetic is ring's. None of them has network code.
cms = "=0.2.3"
x509-cert = "=0.2.5"
der = { version = "=0.7.10", features = ["alloc", "oid"] }
const-oid = "=0.9.6"
spki = "=0.7.3"
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }

# The outlines of the letters of a typed signature picture (see src/sigmark.rs), read from the
# bundled fonts only. `ttf-parser` is not used: it is unmaintained (RUSTSEC-2026-0192).
skrifa = { version = "=0.40.0", default-features = false, features = ["std"] }

# System calls for the sandbox and the resource limits (pinned like everything else).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_Networking_WinSock",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
partridge-engine-client = { path = "../engine-client" }
partridge-testkit = { path = "../testkit" }
